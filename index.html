<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes raccourcis · Center Parcs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#e9f1ea; --bg2:#cfe3d6; --ink:#17342a; --pine:#1f4d3a; --lake:#2f7d8c; --sun:#f08a24;
  --tile:#fffdf8; --tile-edge:#d9c9a8; --shadow:rgba(23,52,42,.22); --tree:#2c6a4f; --tree2:#1f4d3a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1f19; --bg2:#173126; --ink:#e6f1ea; --tile:#21392e; --tile-edge:#3b5a49; --shadow:rgba(0,0,0,.5); --tree:#1b4533; --tree2:#143428;}
}
:root[data-theme="dark"]{--bg:#0f1f19; --bg2:#173126; --ink:#e6f1ea; --tile:#21392e; --tile-edge:#3b5a49; --shadow:rgba(0,0,0,.5); --tree:#1b4533; --tree2:#143428;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px) var(--bg);}
header{position:relative;padding:34px 20px 0;text-align:center;overflow:hidden}
.sun{position:absolute;top:18px;right:12%;width:64px;height:64px;border-radius:50%;background:var(--sun);opacity:.9}
h1{position:relative;margin:0;font-size:clamp(1.9rem,6vw,3rem);font-weight:800;letter-spacing:-.02em;color:var(--pine)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}
:root[data-theme="dark"] h1{color:var(--ink)}
.sub{position:relative;margin:6px 0 0;font-size:1.02rem;opacity:.8}
.forest{display:block;width:100%;height:90px;margin-top:10px}
main{max-width:860px;margin:0 auto;padding:8px 20px 40px}
.bar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:18px}
.btn{font:inherit;font-weight:700;border:2px solid var(--pine);color:var(--pine);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .15s,color .15s}
.btn:hover,.btn.on{background:var(--pine);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:var(--ink);border-color:var(--tile-edge)}:root:not([data-theme="light"]) .btn:hover,:root:not([data-theme="light"]) .btn.on{background:var(--sun);color:#1b1b1b;border-color:var(--sun)}}
:root[data-theme="dark"] .btn{color:var(--ink);border-color:var(--tile-edge)}
:root[data-theme="dark"] .btn:hover,:root[data-theme="dark"] .btn.on{background:var(--sun);color:#1b1b1b;border-color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(184px,45%),1fr));gap:18px}
.tile{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:5.4rem;text-decoration:none;
  background:var(--tile);border:3px solid var(--tile-edge);border-radius:26px 26px 18px 18px;box-shadow:0 6px 0 var(--tile-edge),0 12px 18px var(--shadow);
  transition:transform .15s,box-shadow .15s;user-select:none;-webkit-user-select:none}
.tile::before{content:"";position:absolute;left:12%;right:12%;top:-3px;height:7px;border-radius:0 0 8px 8px;background:var(--sun);opacity:.85}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 10px 0 var(--tile-edge),0 18px 22px var(--shadow);outline:none}
.tile:focus-visible{border-color:var(--lake)}
.editing .tile{cursor:grab;animation:wob .5s ease-in-out infinite alternate}
.editing .tile:nth-child(even){animation-delay:.12s}
@keyframes wob{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.editing .tile{animation:none}}
.sortable-ghost{opacity:.35}
.sortable-chosen{cursor:grabbing}
.del{display:none;position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#c8402b;color:#fff;font:700 16px/1 inherit;cursor:pointer;align-items:center;justify-content:center;padding:0}
.editing .del{display:flex}
.add{display:none;aspect-ratio:1;border:3px dashed var(--lake);border-radius:26px;background:transparent;color:var(--lake);font-size:4.8rem;cursor:pointer}
.editing .add{display:block}
.hint{text-align:center;margin:26px 0 0;font-size:.95rem;opacity:.75;min-height:1.4em}
dialog{border:none;border-radius:22px;padding:22px;width:min(92vw,360px);background:var(--tile);color:var(--ink);box-shadow:0 20px 50px var(--shadow)}
dialog::backdrop{background:rgba(10,30,22,.55)}
dialog h2{margin:0 0 14px;font-size:1.25rem}
label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--tile-edge);background:transparent;color:var(--ink)}
input:focus{outline:none;border-color:var(--lake)}
.row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.btn.fill{background:var(--sun);border-color:var(--sun);color:#1b1b1b}
.tile img{width:68%;height:68%;object-fit:contain;border-radius:12px;pointer-events:none}
.imgrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.imgrow img{width:44px;height:44px;object-fit:contain;border-radius:10px;border:2px solid var(--tile-edge)}
.imgrow .btn{padding:6px 12px;font-size:.9rem}
footer{text-align:center;padding:10px 20px 30px;font-size:.9rem;opacity:.75}
.tile{cursor:pointer}
.tile::after{content:attr(data-name);position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);max-width:140%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--sun);color:#1b1b1b;font-weight:800;font-size:.95rem;padding:5px 14px;border-radius:999px;box-shadow:0 4px 10px var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.tile:hover::after,.tile:focus-visible::after{opacity:1}

.authbox{max-width:460px;margin:18px auto 24px;padding:18px;background:var(--tile);border:2px solid var(--tile-edge);border-radius:18px;box-shadow:0 8px 18px var(--shadow)}
.authbox h2{margin:0 0 8px;font-size:1.2rem}.authbox p{margin:6px 0 12px}.authbox .authrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.authbox .authrow .btn{flex:1}.authstatus{font-size:.92rem;min-height:1.3em;margin-top:10px}.authuser{font-weight:800;overflow-wrap:anywhere}
#app[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="sun" aria-hidden="true"></div>
  <h1>Mes raccourcis Center Parcs</h1>
  <p class="sub">Tout ce qu’il faut pour faire une prépa, à portée de clic.</p>
  <svg class="forest" viewBox="0 0 800 90" preserveAspectRatio="none" aria-hidden="true">
    <g fill="var(--tree2)"><path d="M0 90V60l20-30 20 30-8 0 18 24H0zM90 90l25-60 25 60zM200 90l20-40 20 40zM330 90l28-66 28 66zM470 90l22-50 22 50zM590 90l26-62 26 62zM700 90l20-46 20 46z"/></g>
    <g fill="var(--tree)"><path d="M40 90l22-48 22 48zM150 90l18-36 18 36zM260 90l24-54 24 54zM400 90l20-44 20 44zM530 90l18-38 18 38zM650 90l22-50 22 50zM760 90l24-56 16 56z"/></g>
    <rect y="84" width="800" height="6" fill="var(--lake)"/>
  </svg>
</header>
<section class="authbox" id="authbox" aria-live="polite">
  <h2>Mon espace personnel</h2>
  <p>Connecte-toi pour retrouver uniquement tes propres raccourcis sur tes appareils.</p>
  <label for="auth-email">Adresse e-mail</label>
  <input id="auth-email" type="email" autocomplete="email" placeholder="toi@exemple.fr">
  <label for="auth-password">Mot de passe</label>
  <input id="auth-password" type="password" autocomplete="current-password" placeholder="Au moins 6 caractères">
  <div class="authrow">
    <button class="btn fill" id="auth-login" type="button">Se connecter</button>
    <button class="btn" id="auth-signup" type="button">Créer mon compte</button>
  </div>
  <p class="authstatus" id="auth-status">Configure d'abord les identifiants Supabase dans le fichier.</p>
  <div class="authrow" id="auth-account-row" hidden>
    <span class="authuser" id="auth-user"></span>
    <button class="btn" id="auth-logout" type="button">Déconnexion</button>
  </div>
</section>
<main id="app" hidden>
  <div class="bar">
    <button class="btn" id="edit" type="button">Organiser</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint" id="hint"></p>
</main>

<dialog id="dlg">
  <h2 id="dlg-title">Nouveau raccourci</h2>
  <label for="f-name">Nom (affiché au survol)</label>
  <input id="f-name" maxlength="40" placeholder="Ex. Météo du domaine">
  <label for="f-url">Adresse du site</label>
  <input id="f-url" placeholder="https://…" inputmode="url">
  <label for="f-icon">Icône : un emoji ou une image</label>
  <input id="f-icon" maxlength="4" placeholder="🌲">
  <div class="imgrow"><button class="btn" id="pick" type="button">Choisir une image</button><input id="f-file" type="file" accept="image/*" hidden><img id="prev" alt="" hidden><button class="btn" id="rmimg" type="button" hidden>Retirer</button></div>
  <div class="row">
    <button class="btn" id="cancel" type="button">Annuler</button>
    <button class="btn fill" id="save" type="button">Ajouter</button>
  </div>
</dialog>

  var items, editing=false;
  var grid=document.getElementById("grid"), hint=document.getElementById("hint"), editBtn=document.getElementById("edit"), app=document.getElementById("app");

  function setStatus(message){ document.getElementById("auth-status").textContent=message; }
  function loadDefaults(){ return DEFAULTS.slice(); }
  async function loadFromCloud(){
    if(!db || !currentUser) return;
    loadingData=true;
    try{
      var result=await db.from("user_shortcuts").select("items").eq("user_id",currentUser.id).maybeSingle();
      if(result.error) throw result.error;
      if(result.data && Array.isArray(result.data.items)) items=result.data.items;
      else {
        items=loadDefaults();
        var created=await db.from("user_shortcuts").insert({user_id:currentUser.id,items:items});
        if(created.error && created.error.code!=="23505") throw created.error;
      }
      document.getElementById("app").hidden=false;
      render();
      setStatus("Connecté : tes raccourcis personnels sont chargés.");
    }catch(e){ setStatus("Erreur de chargement Supabase : "+(e.message||"vérifie la table et les règles RLS.")); }
    finally{ loadingData=false; }
  }
  async function save(){
    if(loadingData || !db || !currentUser) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async function(){
      var result=await db.from("user_shortcuts").upsert({user_id:currentUser.id,items:items,updated_at:new Date().toISOString()},{onConflict:"user_id"});
      if(result.error) setStatus("Erreur de sauvegarde : "+result.error.message);
      else setStatus("Toutes les modifications sont sauvegardées.");
    },250);
  }
  async function refreshSession(){
    if(!db){ document.getElementById("app").hidden=true; setStatus("Configuration requise : ajoute l'URL et la clé publique de ton projet Supabase dans le code."); return; }
    var res=await db.auth.getSession();
    if(res.error){setStatus(res.error.message);return;}
    currentUser=res.data.session?res.data.session.user:null;
    updateAuthUI();
    if(currentUser) await loadFromCloud(); else {document.getElementById("app").hidden=true; items=[]; render(); setStatus("Connecte-toi ou crée un compte pour accéder à tes raccourcis.");}
  }
  function placeAuthBox(){
    var box=document.getElementById("authbox"), main=document.getElementById("app");
    if(!box||!main||!main.parentNode) return;
    /* connecté : l'encadré passe sous les raccourcis ; déconnecté : il revient en haut */
    if(currentUser) main.parentNode.insertBefore(box,main.nextSibling);
    else main.parentNode.insertBefore(box,main);
  }
  function updateAuthUI(){
    placeAuthBox();
    var row=document.getElementById("auth-account-row");
    row.hidden=!currentUser;
    document.getElementById("auth-user").textContent=currentUser?currentUser.email:"";
    document.getElementById("auth-email").disabled=!!currentUser;
    document.getElementById("auth-password").disabled=!!currentUser;
    document.getElementById("auth-login").hidden=!!currentUser;
    document.getElementById("auth-signup").hidden=!!currentUser;
  }
  async function authenticate(kind){
    if(!db){setStatus("Configure d'abord l'URL et la clé publique Supabase dans le code.");return;}
    var email=document.getElementById("auth-email").value.trim(), password=document.getElementById("auth-password").value;
    if(!email || !password){setStatus("Renseigne ton adresse e-mail et ton mot de passe.");return;}
    setStatus("Connexion en cours…");
    var res= kind==="signup" ? await db.auth.signUp({email:email,password:password}) : await db.auth.signInWithPassword({email:email,password:password});
    if(res.error){setStatus(res.error.message);return;}
    if(kind==="signup" && !res.data.session){setStatus("Compte créé. Vérifie tes e-mails pour confirmer l'inscription, puis connecte-toi.");return;}
    currentUser=res.data.user || (res.data.session && res.data.session.user) || null;
    updateAuthUI();
    if(currentUser) await loadFromCloud();
  }
  document.getElementById("auth-login").addEventListener("click",function(){authenticate("login");});
  document.getElementById("auth-signup").addEventListener("click",function(){authenticate("signup");});
  document.getElementById("auth-logout").addEventListener("click",async function(){
    if(db){var res=await db.auth.signOut();if(res.error){setStatus(res.error.message);return;}}
    currentUser=null;items=[];document.getElementById("app").hidden=true;updateAuthUI();render();setStatus("Déconnecté. Tes données restent enregistrées dans ton compte.");
  });


  function render(){
    grid.innerHTML="";
    items.forEach(function(it,idx){
      var a=document.createElement("a");
      a.className="tile"; a.setAttribute("role","link"); a.tabIndex=0;
      a.dataset.name=it.n; a.setAttribute("aria-label",it.n); a.dataset.idx=idx;
      if(it.img){var im=document.createElement("img");im.src=it.img;im.alt="";im.draggable=false;a.appendChild(im);}else a.textContent=it.i;
      function go(){ if(editing){ openDlg(idx); } else { window.open(it.u,"_blank","noopener,noreferrer"); } }
      a.addEventListener("click",go);
      a.addEventListener("keydown",function(e){ if(e.target===a&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); go(); } });
      var d=document.createElement("button");
      d.type="button"; d.className="del"; d.textContent="×"; d.setAttribute("aria-label","Supprimer "+it.n);
      d.addEventListener("click",function(e){ e.preventDefault(); e.stopPropagation(); items.splice(idx,1); save(); render(); });
      a.appendChild(d);
      grid.appendChild(a);
    });
    var add=document.createElement("button");
    add.type="button"; add.className="add"; add.textContent="+"; add.setAttribute("aria-label","Ajouter un raccourci");
    add.addEventListener("click",function(){ openDlg(); });
    grid.appendChild(add);
    setupSort();
    hint.textContent=editing?"Glissez une icône pour la déplacer, touchez-la pour la modifier.":"";
  }

  var sortable=null;
  function setupSort(){
    if(sortable){sortable.destroy();sortable=null;}
    if(!window.Sortable) return;
    sortable=Sortable.create(grid,{
      animation:180, draggable:".tile", disabled:!editing, delay:120, delayOnTouchOnly:true,
      onEnd:function(){
        var order=[].slice.call(grid.querySelectorAll(".tile")).map(function(el){return items[+el.dataset.idx];});
        items=order; save(); render();
      }
    });
  }

  editBtn.addEventListener("click",function(){
    editing=!editing;
    app.classList.toggle("editing",editing);
    editBtn.classList.toggle("on",editing);
    editBtn.textContent=editing?"Terminé":"Organiser";
    render();
  });

  var dlg=document.getElementById("dlg"), fn=document.getElementById("f-name"), fu=document.getElementById("f-url"), fi=document.getElementById("f-icon");
  var pendingImg=null;
  function setImg(d){
    pendingImg=d;
    var p=document.getElementById("prev"); if(d){p.src=d;}
    p.hidden=!d; document.getElementById("rmimg").hidden=!d;
  }
  var fileIn=document.getElementById("f-file");
  document.getElementById("pick").addEventListener("click",function(){fileIn.click();});
  document.getElementById("rmimg").addEventListener("click",function(){setImg(null);});
  fileIn.addEventListener("change",function(){
    var f=fileIn.files&&fileIn.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=128,r=Math.min(s/im.width,s/im.height,1),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*r)); c.height=Math.max(1,Math.round(im.height*r));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        try{setImg(c.toDataURL("image/png"));}catch(e){}
        fileIn.value="";
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  var editIdx=-1, saveBtn=document.getElementById("save"), dlgTitle=document.getElementById("dlg-title");
  function openDlg(idx){
    editIdx=(typeof idx==="number")?idx:-1;
    var it=editIdx>=0?items[editIdx]:null;
    fn.value=it?it.n:""; fu.value=it?it.u:""; fi.value=it?it.i:"";
    dlgTitle.textContent=it?"Modifier le raccourci":"Nouveau raccourci";
    setImg(it&&it.img?it.img:null);
    saveBtn.textContent=it?"Enregistrer":"Ajouter";
    dlg.showModal(); fn.focus();
  }
  document.getElementById("cancel").addEventListener("click",function(){dlg.close();});
  document.getElementById("save").addEventListener("click",function(){
    var u=fu.value.trim(); if(!u) {fu.focus();return;}
    if(!/^https?:\/\//i.test(u)) u="https://"+u;
    var obj={n:fn.value.trim()||u.replace(/^https?:\/\//i,""),u:u,i:fi.value.trim()||"🔗",img:pendingImg||undefined};
    if(editIdx>=0) items[editIdx]=obj; else items.push(obj);
    save(); dlg.close(); render();
  });

  items=[]; render();
  refreshSession();
  if(db) db.auth.onAuthStateChange(function(_event,session){
    currentUser=session?session.user:null;
    updateAuthUI();
    if(currentUser) { setTimeout(function(){loadFromCloud();},0); }
    else { document.getElementById("app").hidden=true; items=[]; render(); }
  });
})();
</script>
